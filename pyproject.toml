[project]
name = "semiai"
version = "0.1.0"
description = "半导体 AI for Science 个人学习仓库的公共代码包"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# 核心科学栈 + Quarto 渲染所需的 Jupyter 组件（见 PROJECT_BLUEPRINT.md 第 11.3 节）。
# 版本由 uv.lock 锁定，这里不写死。
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "pyyaml",
    "plotly",
    "jupyterlab",
    "jupytext",
    "ipykernel",
    "nbformat",
    "nbclient",
    "jupyter-cache",
]

# 其余依赖只在某章节确实需要时才添加（torch、e3nn、ase、xgboost、mlflow 等），
# 届时放入 [project.optional-dependencies] 的 dl / geometric / atomistic / boosting / mlops。
# perf：M01.5 高性能科学 Python 用到的 Numba 与 line_profiler，安装方式 `uv sync --extra perf`。

[project.optional-dependencies]
perf = ["numba", "line-profiler"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "nbstripout",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semiai"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
# importlib 模式：各模块的 tests/ 目录里可以有同名测试文件而不冲突。
addopts = "--import-mode=importlib -m 'not slow and not gpu'"
markers = [
    "slow: 运行超过约 1 分钟，默认不运行",
    "gpu: 需要 GPU，默认不运行",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_site", "_freeze", ".quarto", "library"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
