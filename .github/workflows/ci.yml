name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Quarto CLI 单独安装，版本与 docs/getting-started.md 记录的一致。
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      # 安装核心依赖与 dev 组。
      # PyTorch 尚未加入依赖；加入 dl extra 后在这里安装 CPU 版。
      - name: Install dependencies
        run: uv sync --locked

      # ruff + 以参考解答运行全部测试 + 仓库一致性 + 索引检查。
      # 标记为 slow 或 gpu 的测试默认不运行。
      - name: make check
        run: make check

      - name: Exercise stubs must fail
        run: |
          if LEARN_TARGET=exercises uv run pytest -q modules/04-classical-machine-learning/tests -x -k "ols_matches_sklearn" ; then
            echo "练习桩不应该通过测试" && exit 1
          fi

      - name: make site
        run: make site

      # 只在 main 分支的 push 上把渲染好的 _site/ 交给 GitHub Pages；PR 只检查不发布。
      - name: Upload site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 发布学习网站。需要先在仓库 Settings → Pages 把 Source 设为 “GitHub Actions”。
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
