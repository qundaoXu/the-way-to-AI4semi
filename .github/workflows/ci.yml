name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Quarto CLI 单独安装，版本与 docs/getting-started.md 记录的一致。
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      - name: Install CJK font for figures
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      # 安装已建设 M01–M05 的依赖；Linux torch 由锁文件选择官方 CPU wheel。
      - name: Install dependencies
        run: uv sync --locked --extra perf --extra data --extra dl

      # ruff + 以参考解答运行全部测试 + 仓库一致性 + 索引检查。
      # 标记为 slow 或 gpu 的测试默认不运行。
      - name: make check
        run: make check

      - name: Exercise stubs must fail
        run: |
          if LEARN_TARGET=exercises uv run pytest -q modules/04-classical-machine-learning/tests -x -k "ols_matches_sklearn" ; then
            echo "练习桩不应该通过测试" && exit 1
          fi

      # 发布构建（PROJECT_BLUEPRINT.md 第 6.8 节）：publish profile 剥离 .anno-* 批注，
      # 隐藏“在 VS Code 中编辑”按钮，不写入任何本机路径。
      - name: Render site (publish profile)
        run: uv run quarto render --profile publish

      # 只在 main 分支的 push 上把渲染好的 _site/ 交给 GitHub Pages；PR 只检查不发布。
      - name: Upload site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 发布学习网站。需要先在仓库 Settings → Pages 把 Source 设为 “GitHub Actions”。
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
