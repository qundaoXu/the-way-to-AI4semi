# 课程结构与建设状态的唯一维护位置（PROJECT_BLUEPRINT.md 第 11.1 节）。
#
# - 这里只记录课程结构（模块、章节、优先级、先修、锚点）和建设状态 build_status。
# - 学习状态、掌握证据、复测日期记录在各讲义的 frontmatter 中，归学习者所有。
# - 修改本文件后运行 `make sync`，由脚本重新生成 CURRICULUM.md、各模块 README 的章节表、
#   progress/ 下的清单与 status.json。
#
# 字段说明
#   priority      P0 | P1 | P2 | P3 | Branch
#   tags          [FT] 表示 Fast-track 候选：诊断通过即可跳过正文，只做练习验证
#   prereqs       章节级先修。蓝图明文规定的先修见各章注释，其余为建设时的建议，诊断后可调整
#   anchors       研究锚点，取自蓝图第 3.2 节的对应表
#   note          讲义路径，相对于模块目录；文件在该章建设时才创建
#   build_status  Planned | Draft | Reviewed | Verified
#   scope         本章覆盖的内容范围，取自蓝图第 3.4 节

version: 1

anchors:
  A1: 力与应力如何由能量模型通过自动微分得到；为什么某些势在 NVE 中能量不守恒
  A2: 主动学习为什么会失效：探索器与目标构型分布不匹配、不确定性估计不准、标注设置不一致
  A3: 为什么“低 RMSE ≠ 可用的势”：如何设计分层评价体系
  A4: 大尺度无序体系的电子结构：带尾、局域化与大规模稀疏矩阵的数值方法
  A5: 老化轨迹的时间序列分析：对数时间采样、漂移、变化点
  A6: 晶体生成与电荷密度预测：扩散模型如何处理周期性与对称性，如何评价生成质量
  A7: 用 PCM 器件电导态表示神经网络权重：量化、噪声与漂移对模型的影响
  A8: 跨尺度传递：从 MLMD 热物性到连续介质电热仿真，再到代理模型与不确定性传播

modules:
  # ---------------------------------------------------------------------------
  - id: M01
    dir: modules/01-cs-foundations
    title: Computer Science Foundations
    title_zh: 计算机基础
    priority: P0
    hours: 30–45 h
    anchors: [A4]
    chapters:
      - id: M01.1
        title: Advanced Python
        title_zh: Python 进阶
        priority: P0
        tags: [FT]
        prereqs: []
        anchors: []
        note: notes/01-advanced-python.qmd
        build_status: Planned
        scope: 数据模型与 Pythonic 写法；迭代器、生成器与惰性计算；装饰器与闭包；上下文管理器；dataclass 与类型注解；包、模块与导入机制；异常设计；科学数据序列化（JSON、HDF5、extxyz）及 pickle 的安全与兼容性问题。
      - id: M01.2
        title: Data Structures and Algorithms for Scientific Computing
        title_zh: 数据结构与算法（科学计算取向）
        priority: P0
        tags: []
        prereqs: [M01.1]
        anchors: []
        note: notes/02-data-structures-algorithms.qmd
        build_status: Planned
        scope: 时间与空间复杂度；数组、哈希表、堆、树、图；排序与搜索；递归、分治、动态规划与贪心基础。领域例题：周期性边界条件下的最小镜像约定；cell list 与 KD-tree 邻居搜索；用连通分量与最短路计算键网络的团簇与环统计。面试刷题部分为 P2。
      - id: M01.3
        title: Development Toolchain
        title_zh: 开发工具链
        priority: P0
        tags: [FT]
        prereqs: []
        anchors: []
        note: notes/03-dev-toolchain.qmd
        build_status: Planned
        scope: Linux 与 Shell 脚本；Git 进阶（分支策略、rebase、bisect、冲突处理）；环境与依赖管理（uv、conda）；调试（pdb、IDE 调试器）；日志；pytest；ruff；pre-commit。FT 仅适用于部分内容。
      - id: M01.4
        title: Computer Systems Basics
        title_zh: 计算机系统基础
        priority: P1
        tags: []
        prereqs: [M01.1]
        anchors: []
        note: notes/04-computer-systems.qmd
        build_status: Planned
        scope: 存储层次与缓存局部性；进程、线程与 GIL；并发与 multiprocessing；I/O 瓶颈；IEEE 754 浮点表示与舍入误差；网络与 HTTP/API 基础（P2）。
      - id: M01.5
        title: High-Performance Scientific Python
        title_zh: 高性能科学 Python
        priority: P0
        tags: []
        prereqs: [M01.1]
        anchors: []
        note: notes/05-high-performance-python.qmd
        build_status: Planned
        scope: NumPy 内存布局与 strides；广播与向量化；einsum；避免隐式拷贝；cProfile、line_profiler 性能分析；Numba 入门。

  # ---------------------------------------------------------------------------
  - id: M02
    dir: modules/02-mathematics-statistics
    title: Mathematics, Statistics and Optimization
    title_zh: 数学、统计与最优化
    priority: P0/P1
    hours: 90–120 h
    anchors: [A1, A4, A6]
    chapters:
      - id: M02.1
        title: Linear Algebra
        title_zh: 线性代数
        priority: P0
        tags: []
        prereqs: []
        anchors: [A4]
        note: notes/01-linear-algebra.qmd
        build_status: Planned
        scope: 向量空间、子空间与正交投影；特征分解；SVD 与低秩近似；PCA 的两种推导（最大方差与最小重构误差）；正定矩阵；矩阵范数与条件数。
      - id: M02.2
        title: Calculus and Matrix Calculus
        title_zh: 微积分与矩阵微积分
        priority: P0
        tags: []
        prereqs: [M02.1]
        anchors: [A1]
        note: notes/02-matrix-calculus.qmd
        build_status: Planned
        scope: 梯度、Jacobian、Hessian；矩阵形式的链式法则；常用矩阵求导结果；Taylor 展开；Lagrange 乘子。
      - id: M02.3
        title: Probability and Information Theory
        title_zh: 概率论与信息论
        priority: P0
        tags: []
        prereqs: [M02.2]
        anchors: []
        note: notes/03-probability-information.qmd
        build_status: Planned
        scope: 随机变量与分布；条件概率与贝叶斯定理；多元高斯分布的边缘与条件分布（高斯过程的基础）；期望、方差、协方差；变量变换公式（normalizing flow 的基础）；熵、交叉熵、KL 散度、互信息。
      - id: M02.4
        title: Mathematical Statistics
        title_zh: 数理统计
        priority: P0
        tags: []
        prereqs: [M02.3]
        anchors: []
        note: notes/04-mathematical-statistics.qmd
        build_status: Planned
        scope: 点估计、MLE、MAP；估计量的偏差与方差；置信区间；假设检验与多重比较校正；Bootstrap；贝叶斯推断入门。
      - id: M02.5
        title: Optimization
        title_zh: 最优化
        priority: P0
        tags: []
        prereqs: [M02.1, M02.2]
        anchors: []
        note: notes/05-optimization.qmd
        build_status: Planned
        scope: 凸集与凸函数；梯度下降与 SGD 的收敛直觉；Momentum、Adam、AdamW；二阶与拟牛顿方法（L-BFGS，及其在结构优化中的应用）；约束优化与 KKT 条件。贝叶斯优化归属 M06.5。
      - id: M02.6
        title: Numerical Methods
        title_zh: 数值方法
        priority: P0
        tags: []
        prereqs: [M02.1, M02.2]
        anchors: [A1, A4]
        note: notes/06-numerical-methods.qmd
        build_status: Planned
        scope: 浮点误差、条件数与数值稳定性；线性方程组（LU、Cholesky、共轭梯度）；稀疏矩阵存储与运算；迭代特征值算法（幂迭代、Lanczos）；插值与数值积分；ODE 积分器（Euler、Runge–Kutta、Verlet 与辛积分的能量守恒性质）；PDE 离散入门（有限差分、有限元的基本思想）。
      - id: M02.7
        title: Group Theory and Representation Theory
        title_zh: 群论与表示论
        priority: P1
        tags: []
        prereqs: [M02.1]
        anchors: [A6]
        note: notes/07-group-representation-theory.qmd
        build_status: Planned
        scope: 群、子群、陪集；对称群、SO(3)、O(3)、E(3)；群表示与不可约表示；球谐函数；Wigner-D 矩阵；张量积与 Clebsch–Gordan 分解；晶体点群与空间群简介。本章是 M06.3 的直接前置。
      - id: M02.8
        title: Stochastic Processes and Sampling
        title_zh: 随机过程与采样
        priority: P1
        tags: []
        prereqs: [M02.3, M02.6]
        anchors: [A6]
        note: notes/08-stochastic-processes-sampling.qmd
        build_status: Planned
        scope: Markov 链与平稳分布；MCMC（Metropolis–Hastings）；Langevin 动力学与 Fokker–Planck 方程；随机微分方程入门；重要性采样。本章是连接分子动力学采样与扩散模型（M06.4）的桥梁。

