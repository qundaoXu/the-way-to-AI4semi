        scope: 偶然不确定性与认知不确定性；深度集成、MC Dropout、证据学习、最后一层高斯过程；校准评价（误差–不确定性相关性、校准曲线）；采集函数；主动学习循环及其失败模式（探索器与目标分布不匹配、不确定性失效、标注设置不一致）；贝叶斯优化。三者的主要归属章节。
      - id: M06.6
        title: Representation Learning and Transfer
        title_zh: 表征学习与迁移
