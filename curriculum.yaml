        scope: 不变性与等变性；基于距离与角度的不变网络（SchNet、DimeNet 类）；E(3) 等变网络（张量场网络、NequIP）；高阶多体相互作用（ACE、MACE）；局域性、截断半径与消息传递层数的关系；e3nn 实践。AI for Science 核心。
